<!doctype html>
<html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Composer</title>
<style>body{margin:0;padding:12px;background:var(--paper-sunk)} .hy-composer{max-width:340px}</style></head>
<body><div class="hy-composer">
<div class="hy-chips"><button class="hy-chip">Aucune</button><button class="hy-chip hy-cat-idee">Idée</button><button class="hy-chip hy-cat-question is-selected">Question</button><button class="hy-chip hy-cat-citation">Citation</button></div>
<textarea class="hy-textarea" rows="3" placeholder="Votre commentaire…"></textarea>
<div class="hy-composer-bar"><span class="hy-hint">Ctrl+Entrée</span><button class="hy-btn hy-btn--quiet">Annuler</button><button class="hy-btn hy-btn--primary">Enregistrer</button></div>
</div></body></html>
