# Publie une release à chaque tag de version (x.y.z, sans « v »).
# Les fichiers sont construits ici, depuis le dépôt, puis attestés : chacun peut vérifier leur provenance avec
#   gh attestation verify main.js -R Floernt/hypomnema
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Même lint que le scan du catalogue Obsidian (paquet séparé : il lui faut TypeScript < 6.1)
      - run: npm ci --prefix scripts/lint
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes de version : la section du CHANGELOG correspondant au tag.
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1; next }
            /^\[.*\]: / { inside = 0 }
            inside
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
